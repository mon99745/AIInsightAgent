<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AIA Console</title>
    <link rel="stylesheet" th:href="@{/css/console.css}">
</head>
<body class="login-body">
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h1>AIA Console</h1>
            <p>관리자 로그인</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${logoutMessage}" class="alert alert-info" th:text="${logoutMessage}"></div>

        <form th:action="@{/login}" method="post" class="login-form">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username"
                       class="form-control" placeholder="아이디를 입력하세요"
                       autofocus autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password"
                       class="form-control" placeholder="비밀번호를 입력하세요"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary login-btn">로그인</button>
        </form>
    </div>
</div>
</body>
</html>
