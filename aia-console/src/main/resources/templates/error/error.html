<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Error</title>
</head>
<body>
<div layout:fragment="content">
    <div class="error-container">
        <div class="error-code" th:text="${status}">500</div>
        <div class="error-title" th:text="${error}">Internal Server Error</div>
        <div class="error-message" th:text="${message}">An unexpected error occurred.</div>
        <div class="error-trace" th:if="${traceId}">
            Trace ID: <span th:text="${traceId}"></span>
        </div>
        <div style="margin-top: 24px;">
            <a th:href="@{/dashboard}" class="btn btn-primary">Dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
